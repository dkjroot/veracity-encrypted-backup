[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verwrity-encrypted-backup"
version = "0.1.0"
description = "Private, portable backups for your Verwrity writing"
requires-python = ">=3.11"
dependencies = ["cryptography>=46,<49"]

[project.scripts]
verwrity-backup = "backup:main"

[tool.setuptools]
py-modules = ["backup"]
